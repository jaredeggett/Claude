# Lumen7 — connected 7-day pillbox
# REFERENCE SKETCH ONLY. This has never been flashed or tested.
# Pin assignments are placeholders until the PCB in Phase 5 is laid out.
# See docs/DESIGN-PLAN.md for the design this implements.

substitutions:
  device_name: lumen7

esphome:
  name: ${device_name}
  friendly_name: Pillbox

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO6      # placeholder
  scl: GPIO7      # placeholder
  scan: true

# Two 16-channel expanders:
#   0x20 (main PCB)  -> 7 pod-presence hall sensors + 2 buttons
#   0x21 (spine PCB) -> 7 lid-state hall sensors
mcp23017:
  - id: mcp_main
    address: 0x20
  - id: mcp_spine
    address: 0x21

time:
  - platform: ds1307      # DS3231 is register-compatible
    id: rtc
    update_interval: never
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc

light:
  - platform: esp32_rmt_led_strip
    id: bay_leds
    name: Bay lights
    pin: GPIO8            # placeholder
    num_leds: 8           # 7 bays + 1 status
    chipset: WS2812
    rgb_order: GRB

output:
  - platform: ldo         # placeholder for piezo driver
    pin: GPIO9
    id: buzzer_out

globals:
  - id: refill_mode
    type: bool
    restore_value: false
    initial_value: 'false'

# ---------------------------------------------------------------------------
# Per-bay sensing.
#
# DRV5032FA is active-low: output pulls low in the presence of a field.
# So "magnet present" == inverted input. Both pairs use the same convention.
#
#   presence=1, lid=1 -> SEATED_CLOSED
#   presence=1, lid=0 -> SEATED_OPEN     (dose event on close, after >=1s open)
#   presence=0, lid=0 -> REMOVED
#   presence=0, lid=1 -> SENSOR_FAULT    (impossible; never log a dose)
#
# Only Monday is written out here. The remaining six bays repeat this block
# with pin numbers 1..6 and their own day names. In the real config this
# should be generated with a packages/!include loop rather than copy-pasted
# seven times.
# ---------------------------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: mon_present
    name: Monday pod present
    pin:
      mcp23xxx: mcp_main
      number: 0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 250ms

  - platform: gpio
    id: mon_lid_closed
    name: Monday lid closed
    pin:
      mcp23xxx: mcp_spine
      number: 0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 250ms
    on_release:                 # lid just opened
      then:
        - logger.log: "Monday lid opened"
    on_press:                   # lid just closed
      then:
        - if:
            condition:
              and:
                # Dose is declared on CLOSE after a >=1s open, not on the
                # opening edge — rejects a bump, and refill mode suppresses
                # the whole thing.
                - lambda: 'return !id(refill_mode);'
                - binary_sensor.is_on: mon_present
                - for:
                    time: 1s
                    condition:
                      binary_sensor.is_off: mon_lid_closed
            then:
              - homeassistant.event:
                  event: esphome.pillbox_dose
                  data:
                    day: monday

  # Refill mode: hold 3s. Without this, a Sunday-night refill logs seven
  # phantom doses. See DESIGN-PLAN section 6.2 — this is required, not optional.
  - platform: gpio
    id: btn_refill
    pin:
      mcp23xxx: mcp_main
      number: 14
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - globals.set:
              id: refill_mode
              value: 'true'
          - light.turn_on:
              id: bay_leds
              red: 100%
              green: 100%
              blue: 100%
          - delay: 10min          # auto-exit
          - globals.set:
              id: refill_mode
              value: 'false'

  - platform: gpio
    id: btn_ack
    name: Acknowledge
    pin:
      mcp23xxx: mcp_main
      number: 15
      mode:
        input: true
        pullup: true
      inverted: true

text_sensor:
  - platform: template
    name: Monday state
    lambda: |-
      bool present = id(mon_present).state;
      bool closed  = id(mon_lid_closed).state;
      if (present && closed)  return {"SEATED_CLOSED"};
      if (present && !closed) return {"SEATED_OPEN"};
      if (!present && !closed) return {"REMOVED"};
      return {"SENSOR_FAULT"};
    update_interval: 5s
